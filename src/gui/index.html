<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keymento</title>
<style>
:root {
  --bg:#282c34; --surface:#1e2127; --raised:#21252b; --overlay:#3e4451;
  --text:#d7dae0; --muted:#8b95a7; --border:#3e4451;
  --accent:#d19a66; --accent-hover:#e5c07b;
  --good:#98c379; --blue:#61afef; --cyan:#56b6c2; --bad:#e06c75; --yellow:#e5c07b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
button,select{font:inherit}
button{cursor:pointer}
button:disabled,select:disabled{opacity:.45;cursor:not-allowed}

.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:5}
.header{height:44px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:5px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.brandMark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}#mainBtn svg{display:block;width:16px;height:16px;fill:currentColor}
.brand small{font-weight:500;color:var(--muted);margin-left:3px}
.transport{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
#mainBtn{width:34px;height:32px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:var(--accent);color:var(--surface);font-weight:800}
#mainBtn:hover:not(:disabled){background:var(--accent-hover)}
#mainBtn.stop{background:var(--bad);color:#fff}
.stateBadge{font-size:12px;color:var(--muted);padding:5px 9px;border-radius:4px;background:var(--raised);border:1px solid var(--border);white-space:nowrap}
.stateBadge.playing{color:var(--good)} .stateBadge.countdown{color:var(--accent)} .stateBadge.done{color:var(--blue)} .stateBadge.error,.stateBadge.aborted{color:var(--bad)}
.headerRight{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}

.controls{display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(4,minmax(150px,1fr));gap:6px;padding:6px 8px;background:var(--bg);border-top:1px solid var(--border)}
.controlBox{min-width:0;display:flex;align-items:center;gap:7px;padding:5px 7px;background:var(--surface);border:1px solid var(--border);border-radius:4px}
.controlBox label{font-size:11px;color:var(--muted);white-space:nowrap}
select{width:100%;min-width:0;padding:5px 7px;background:var(--raised);border:1px solid var(--border);border-radius:4px;color:var(--text);outline:none}
select:focus{border-color:var(--accent)}
.segment{display:flex;gap:3px;flex:1;min-width:0}
.segment button{flex:1;min-width:0;padding:5px 7px;border:0;border-radius:4px;background:var(--raised);color:var(--text);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segment button:hover:not(:disabled){background:var(--overlay)}
.segment button.active{background:var(--accent);color:var(--surface);font-weight:700}
#speedNote{grid-column:1/-1;font-size:11px;color:var(--accent);padding-left:4px;margin-top:-2px}
#speedNote:empty{display:none}

.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 150px;overflow:hidden}
.stage{position:relative;min-width:0;overflow:hidden;background:linear-gradient(180deg,#2c323c 0%,#282c34 62%,#252931 100%)}
.videoFrame{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#171a20;overflow:hidden}
.videoFrame img{display:block;width:100%;height:100%;object-fit:contain}
.videoFrame.active{display:flex}
.stage.hasVideo:before{display:none}
.stage.hasVideo .emptyState{display:none!important}
.stage.hasVideo .playStage{background:transparent}
.stage.hasVideo .noteBeam{left:auto;right:16px;bottom:10px;transform:none;min-width:120px;padding:9px 13px;border-radius:5px;background:rgba(30,33,39,.83)}
.stage.hasVideo .noteBeam #nextNoteName{font-size:24px}
.stage.hasVideo .noteBeam.chord #nextNoteName{font-size:20px}
.stage.hasVideo .targetLine{display:none}
.stage.hasVideo .progressBlock{width:calc(100% - 240px);margin-right:auto;background:rgba(30,33,39,.78);padding:8px;border-radius:5px}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:100% 52px,64px 100%;pointer-events:none}
.emptyState,.countdown,.playStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.emptyState{flex-direction:column;gap:10px;color:var(--muted);text-align:center;padding:30px}
.emptyState .musicIcon{font-size:54px;opacity:.8}.emptyState b{color:var(--text);font-size:20px}.emptyState p{font-size:13px;max-width:440px;line-height:1.6}
.countdown{display:none;font-size:112px;font-weight:800;color:var(--accent);text-shadow:0 8px 30px rgba(0,0,0,.25)}
.playStage{display:none;flex-direction:column;justify-content:flex-end;padding:28px 28px 20px}
.noteRain{position:absolute;inset:0 0 92px;overflow:hidden;pointer-events:none}
.noteBeam{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);min-width:180px;padding:18px 30px;border:1px solid rgba(209,154,102,.7);background:rgba(30,33,39,.88);box-shadow:0 0 40px rgba(209,154,102,.12);text-align:center;border-radius:6px}
.noteBeam .caption{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.noteBeam #nextNoteName{display:block;font-size:64px;color:var(--accent);line-height:1.05;margin-top:6px}.noteBeam.chord #nextNoteName{font-size:42px}
.targetLine{position:absolute;left:0;right:0;bottom:18%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
#judgeBar{flex:none;height:44px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}#lastHit{height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;text-align:center;line-height:1;white-space:nowrap}#lastHit:empty:before{content:"판정 대기 중";display:block;line-height:1;font-size:13px;font-weight:600;color:var(--muted)}
#lastHit.ok{color:var(--good)} #lastHit.bad{color:var(--bad)}
.progressBlock{width:min(760px,94%);position:relative;z-index:2}
.progressMeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:6px}
.bar{height:4px;border-radius:2px;background:var(--overlay);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.sidepanel{border-top:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.panelHeader{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.panelHeader b{font-size:13px}.panelHeader span{font-size:11px;color:var(--muted)}
#modeDesc{padding:8px 12px;font-size:11px;line-height:1.5;color:var(--muted);border-bottom:1px solid var(--border)}
#feed{flex:1;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.feedItem{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:7px;padding:7px;background:var(--raised);border:1px solid transparent;border-radius:4px;font-size:12px}.feedItem:hover{border-color:var(--border)}.feedItem .idx{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.feedItem span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grade-Perfect{color:var(--good);font-weight:700}.grade-Great{color:var(--blue);font-weight:700}.grade-Good{color:var(--yellow);font-weight:700}.grade-Miss,.pitch-bad{color:var(--bad);font-weight:700}
#hint{min-height:26px;padding:6px 10px;color:var(--bad);font-size:11px;border-top:1px solid var(--border)}


#resultCard{display:none;position:absolute;inset:8%;z-index:4;background:rgba(30,33,39,.96);border:1px solid var(--border);border-radius:8px;box-shadow:0 18px 70px rgba(0,0,0,.45);padding:24px;align-items:center;justify-content:center;text-align:center}.resultInner{width:min(680px,100%)}.resultKicker{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.resultTitle{font-size:24px;margin:5px 0 14px}.score{font-size:72px;font-weight:800;color:var(--good);line-height:1}.score small{font-size:18px;color:var(--muted);font-weight:600}.resultRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.metric{padding:14px;background:var(--raised);border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:12px}.metric b{display:block;color:var(--text);font-size:24px;margin-bottom:3px}#gradeRow{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:16px;font-size:12px}

@media(max-width:950px){.controls{grid-template-columns:1fr 1fr}}
@media(max-width:700px){html,body{overflow:auto}.app{min-height:100vh;height:auto;overflow:visible}.header{grid-template-columns:1fr auto}.transport{justify-content:flex-end}.headerRight{display:none}.controls{grid-template-columns:1fr}.workspace{display:flex;flex-direction:column;min-height:620px}.stage{margin-right:0;min-height:430px}.sidepanel{position:static;width:auto;min-height:220px}.noteBeam #nextNoteName{font-size:54px}#resultCard{inset:4%}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="header">
      <div class="brand"><span class="brandMark">♫</span><span>KEYMENTO <small>piano learning</small></span></div>
      <div class="transport"><button id="mainBtn" title="연주 시작">▶</button><span id="stateBadge" class="stateBadge">대기 중</span></div>
      <div class="headerRight"><span id="currentSongLabel">곡을 선택하세요</span></div>
    </div>
    <div class="controls">
      <div class="controlBox"><label>SONG</label><select id="songSelect"></select></div>
      <div class="controlBox"><label>SPEED</label><div class="segment" id="speedRow"></div></div>
      <div class="controlBox"><label>INPUT</label><div class="segment" id="inputRow"></div></div>
      <div class="controlBox"><label>MODE</label><div class="segment" id="modeRow"></div></div>
      <div class="controlBox" id="viewBox" style="display:none"><label>VIEW</label><div class="segment" id="viewRow"></div></div>
      <div id="speedNote"></div>
    </div>
  </div>

  <div id="judgeBar"><div id="lastHit"></div></div>

  <div class="workspace">
    <main class="stage" id="stage">
      <div id="videoFrame" class="videoFrame"><img id="arVideo" alt="실시간 KEYMENTO AR 카메라 영상"></div>
      <div id="emptyState" class="emptyState"><div class="musicIcon">♬</div><b>곡을 선택하고 연주를 시작하세요</b><p>연주 중에는 중앙에서 즉시 판정을 확인하고, 아래에서 기록을 볼 수 있습니다.</p></div>
      <div id="countdownNum" class="countdown"></div>
      <div id="playStage" class="playStage">
        <div class="noteRain"><div class="targetLine"></div><div id="noteBeam" class="noteBeam"><span class="caption">NEXT NOTE</span><b id="nextNoteName">-</b></div></div>
        <div class="progressBlock"><div class="progressMeta"><span>PERFORMANCE</span><span id="progressText">0 / 0</span></div><div class="bar"><i id="barFill"></i></div></div>
      </div>
      <section id="resultCard"><div class="resultInner"><div class="resultKicker">Session complete</div><div class="resultTitle">연주 결과</div><div id="overallScore" class="score">0<small> / 100</small></div><div class="resultRow"><div class="metric"><b id="pitchAcc">-</b><span id="pitchAccLabel">음정 정확도</span></div><div class="metric"><b id="timingAcc">-</b><span id="timingAccLabel">박자 정확도</span></div></div><div id="gradeRow"></div></div></section>
    </main>

    <aside class="sidepanel"><div class="panelHeader"><b>LIVE FEEDBACK</b><span>real-time</span></div><div id="modeDesc"></div><div id="feed"></div><div id="hint"></div></aside>
  </div>

</div>
<script>
const INPUT_LABELS={local:"로컬 MIDI",udp:"Pi (UDP)"};
const STATE_LABELS={idle:"대기 중",countdown:"카운트다운",playing:"연주 중",done:"완주!",aborted:"중단됨",error:"오류"};
const GRADE_EMOJI = { Perfect: "✨", Great: "👍", Good: "👌", Miss: "☁️" };
const $=id=>document.getElementById(id);
let lastSeq=0,running=false,lastGrade=null,videoStarted=false,videoGeneration=0;
// Use individually decoded JPEGs rather than browser-dependent MJPEG parsing.
// The next request is scheduled only after the previous image loads/fails.
function updateVideoPlayback(enabled){
  if(enabled===videoStarted)return;
  videoStarted=enabled;
  const generation=++videoGeneration;
  if(!enabled){$("arVideo").removeAttribute("src");return;}
  function nextFrame(){
    if(!videoStarted||generation!==videoGeneration)return;
    const frame=new Image();
    frame.onload=()=>{
      if(!videoStarted||generation!==videoGeneration)return;
      $("arVideo").src=frame.src;
      setTimeout(nextFrame,180);
    };
    frame.onerror=()=>{
      if(!videoStarted||generation!==videoGeneration)return;
      setTimeout(nextFrame,500);
    };
    frame.src="/video.jpg?t="+Date.now();
  }
  nextFrame();
}

function midiName(n){const names=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];return names[n%12]+(Math.floor(n/12)-1)}
async function postJSON(url,body){
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){$("hint").textContent=data.error||"요청 실패";setTimeout(()=>{$("hint").textContent=""},3000)}
  if(data.songs)render(data); return data
}
function render(s){
  running=s.running;
  const hasVideo=Boolean(s.video_enabled);
  $("stage").classList.toggle("hasVideo",hasVideo);
  $("videoFrame").classList.toggle("active",hasVideo);
  updateVideoPlayback(hasVideo);
  const badge=$("stateBadge");badge.textContent=STATE_LABELS[s.state]||s.state;badge.className="stateBadge "+s.state;
  const selectedSong=s.songs.find(x=>x.id===s.selected);$("currentSongLabel").textContent=selectedSong?selectedSong.name:"곡을 선택하세요";

  const songSelect=$("songSelect");const current=songSelect.value;songSelect.innerHTML="";
  if(!s.songs.length){const o=document.createElement("option");o.textContent="songs/ 폴더에 MIDI 없음";o.value="";songSelect.appendChild(o)}
  for(const song of s.songs){const o=document.createElement("option");o.value=song.id;o.textContent=song.name;if(song.id===s.selected)o.selected=true;songSelect.appendChild(o)}
  songSelect.disabled=running||!s.songs.length;songSelect.onchange=()=>postJSON("/api/select",{song_id:songSelect.value});

  const speedRow=$("speedRow");speedRow.innerHTML="";for(const p of s.presets){const b=document.createElement("button");b.textContent=p+"x";b.disabled=running;if(Math.abs(p-s.speed)<1e-9)b.className="active";b.onclick=()=>postJSON("/api/speed",{speed:p});speedRow.appendChild(b)}
  $("speedNote").textContent=Math.abs(s.speed_scale-1)<1e-9?"":`AR 배율 ${s.speed_scale}x · 실제 ${s.effective_speed.toFixed(2)}x`;

  const inputRow=$("inputRow");inputRow.innerHTML="";for(const src of s.input_sources){const b=document.createElement("button");b.textContent=INPUT_LABELS[src]||src;b.title=src==="udp"?"라즈베리파이 (UDP)":"로컬 MIDI";b.disabled=running;if(src===s.input)b.className="active";b.onclick=()=>postJSON("/api/input",{source:src});inputRow.appendChild(b)}
  $("viewBox").style.display=hasVideo?"":"none";
  const viewRow=$("viewRow");viewRow.innerHTML="";for(const [view,label] of [["crop","건반+여백"],["full","전체"],["flat","펴서 보기"]]){const b=document.createElement("button");b.textContent=label;if(view===s.video_view)b.className="active";b.onclick=()=>postJSON("/api/view",{view});viewRow.appendChild(b)}
  const modeRow=$("modeRow");modeRow.innerHTML="";for(const [practice,label] of [[false,"일반"],[true,"연습"]]){const b=document.createElement("button");b.textContent=label;b.disabled=running;if(practice===s.practice)b.className="active";b.onclick=()=>postJSON("/api/mode",{practice});modeRow.appendChild(b)}
  $("modeDesc").textContent=s.practice?"정답 건반을 칠 때까지 다음 음으로 넘어가지 않습니다. 기다리는 시간이 섞이므로 박자는 판정하지 않고, 점수는 음정만으로 냅니다.":"악보 시계대로 진행합니다. 시간 안에 못 치면 Miss 로 넘어가고, 음정과 박자를 함께 판정합니다.";

  const mainBtn=$("mainBtn");mainBtn.innerHTML=running?'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';mainBtn.className=running?"stop":"";mainBtn.title=running?"연주 중지":"연주 시작";mainBtn.disabled=!running&&!s.songs.length;

  $("emptyState").style.display=s.state==="idle"?"flex":"none";
  $("countdownNum").style.display=s.state==="countdown"?"flex":"none";$("countdownNum").textContent=s.countdown||"";
  $("playStage").style.display=s.state==="playing"?"flex":"none";
  if(s.state==="playing"){
    const p=s.progress||{};const showHint=s.show_hint!==false,showFb=s.show_feedback!==false; /* [실험용] --no-hint / --no-feedback */
    $("noteBeam").style.display=showHint?"":"none";$("nextNoteName").textContent=p.next||"🎉";$("noteBeam").classList.toggle("chord",String(p.next||"").length>8);
    $("barFill").style.width=p.total?(100*p.index/p.total)+"%":"0%";$("progressText").textContent=(p.index||0)+" / "+(p.total||0);
    // Large centre feedback is based only on the original timing grade event.
    // Wrong-pitch retries remain in LIVE FEEDBACK without inventing a grade.
    const hit=$("lastHit");
    if(!showFb){hit.textContent="";hit.className=""}
    else if(!s.practice&&lastGrade){
      const signed=(lastGrade.diff_ms>=0?"+":"")+lastGrade.diff_ms+"ms";
      hit.textContent=GRADE_EMOJI[lastGrade.grade]+" "+lastGrade.grade+" ("+signed+")";
      hit.className=lastGrade.grade==="Miss"?"bad":"ok";
    }else if(s.practice){
      hit.textContent=p.last_note!==null&&p.last_ok?"✅ 통과":"";
      hit.className=p.last_ok?"ok":"";
    }else{hit.textContent="";hit.className=""}
    }

  if(s.state==="error"&&s.error)$("hint").textContent=s.error;
  const result=$("resultCard");
  if(s.result){result.style.display="flex";const practice=s.result.mode==="practice";$("overallScore").innerHTML=s.result.overall+"<small> / 100점</small>";$("pitchAcc").textContent=s.result.pitch_accuracy+"%";$("pitchAccLabel").textContent=practice?"한 번에 맞춘 비율":"음정 정확도";$("timingAcc").textContent=practice?"-":s.result.timing_accuracy+"%";$("timingAccLabel").textContent=practice?"박자 판정 없음":"박자 정확도";const row=$("gradeRow");row.innerHTML="";
    if(practice){const d=document.createElement("div");d.className="grade-Good";d.textContent="🔁 총 오타 "+s.result.wrong_attempts+"회";row.appendChild(d)}else{for(const g of ["Perfect","Great","Good","Miss"]){const d=document.createElement("div");d.className="grade-"+g;d.textContent=GRADE_EMOJI[g]+" "+g+" "+s.result.timing[g];row.appendChild(d)}if(s.result.wrong_attempts){const d=document.createElement("div");d.className="grade-Miss";d.textContent="✖ 오타 "+s.result.wrong_attempts+"회";row.appendChild(d)}}if(s.result.chords){const d=document.createElement("div");d.className="grade-Good";d.textContent="🎹 화음 "+s.result.chords+"곳";row.appendChild(d)}
  }else result.style.display="none";

  // 세션 이벤트 → 판정 피드
  for (const [seq, ev] of s.events) {
    lastSeq = Math.max(lastSeq, seq);
    if (ev.type === "start") {
      $("feed").innerHTML = "";
      lastGrade = null;
    }
    if (ev.type !== "note") continue;
    if (s.show_feedback === false) continue;  // [실험용] --no-feedback
    if (ev.grade && ["Perfect","Great","Good","Miss"].includes(ev.grade)) {
      lastGrade={grade:ev.grade,diff_ms:ev.diff_ms};
    }
    const item = document.createElement("div");
    item.className = "feedItem";
    const pitch = ev.pitch_ok
      ? "✅ " + ev.played
      : '❌ <span class="pitch-bad">' + ev.played + "</span> (정답: " + (ev.expected || "-") + ")";

    // 연습 모드는 박자를 판정하지 않아 grade 가 null 로 온다.
    let mark;
    if (ev.grade) {
      const diff = (ev.diff_ms >= 0 ? "+" : "") + ev.diff_ms + "ms";
      mark = '<span class="grade-' + ev.grade + '">' +
        GRADE_EMOJI[ev.grade] + " " + ev.grade + " " + diff + "</span>";
    } else if (ev.wrong) {
      // 일반 모드의 오타 — 어떤 음도 소진하지 않고 판정 위치도 그대로다.
      mark = '<span class="grade-Miss">✖ 오타</span>';
    } else if (ev.missing_notes && ev.missing_notes.length) {
      // 연습 모드 — 화음을 한꺼번에 다 치지 못해 처음부터 다시 친다.
      mark = '<span class="grade-Miss">🔁 화음 미완성</span>';
    } else if (ev.retry) {
      mark = '<span class="grade-Miss">🔁 다시</span>';
    } else if (ev.chord_progress) {
      mark = '<span class="grade-Good">⏳ 화음 ' +
        ev.chord_progress[0] + "/" + ev.chord_progress[1] + "</span>";
    } else if (ev.first_try) {
      mark = '<span class="grade-Perfect">✅ 한 번에</span>';
    } else {
      mark = '<span class="grade-Good">☑️ 통과</span>';
    }

    item.innerHTML =
      '<span class="idx">' + ev.index + "/" + ev.total + "</span>" +
      "<span>" + pitch + "</span>" + mark;
    $("feed").prepend(item);
    while ($("feed").children.length > 30) $("feed").lastChild.remove();
  }
  // Apply the newest event immediately, not one polling interval later.
  const hit=$("lastHit");
  if(s.state==="playing"&&!s.practice&&lastGrade){
    const signed=(lastGrade.diff_ms>=0?"+":"")+lastGrade.diff_ms+"ms";
    hit.textContent=GRADE_EMOJI[lastGrade.grade]+" "+lastGrade.grade+" ("+signed+")";
    hit.className=lastGrade.grade==="Miss"?"bad":"ok";
  }
}
async function poll(){try{const res=await fetch("/api/state?since="+lastSeq);if(res.ok)render(await res.json())}catch(e){}}
$("mainBtn").onclick=()=>postJSON(running?"/api/stop":"/api/start");poll();setInterval(poll,600);
</script>
</body>
