<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keymento</title>
<style>
  :root {
    --bg: #12151c;
    --card: #1b202b;
    --card-edge: #262d3c;
    --text: #e8ecf4;
    --muted: #8a93a6;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, .16);
    --good: #3ecf8e;
    --warn: #ffc857;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    padding: 20px 16px 48px;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 8px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  #stateBadge {
    font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    background: var(--card-edge); color: var(--muted);
  }
  #stateBadge.playing { background: var(--accent-soft); color: var(--accent); }
  #stateBadge.done { background: rgba(62,207,142,.15); color: var(--good); }
  #stateBadge.error, #stateBadge.aborted { background: rgba(255,107,107,.14); color: var(--bad); }

  .card {
    background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 14px; padding: 16px;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
  }

  /* 곡 목록 */
  #songList { display: grid; gap: 8px; }
  .song {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--card-edge); background: transparent;
    color: var(--text); font-size: 15px; text-align: left; width: 100%;
  }
  .song .dot {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 2px solid var(--muted);
  }
  .song.selected { border-color: var(--accent); background: var(--accent-soft); }
  .song.selected .dot { border-color: var(--accent); background: var(--accent); }

  /* 속도 / 입력 */
  .segment { display: flex; gap: 8px; flex-wrap: wrap; }
  .segment button {
    flex: 1; min-width: 64px; padding: 12px 8px; border-radius: 10px;
    border: 1px solid var(--card-edge); background: transparent;
    color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .segment button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  #modeDesc { margin-top: 10px; font-size: 13px; line-height: 1.5; color: var(--muted); }

  /* 시작/중지 */
  #mainBtn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 18px; font-weight: 700; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  #mainBtn.stop { background: var(--bad); }
  #mainBtn:disabled { opacity: .45; cursor: default; }
  #hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* 진행 상황 */
  #liveCard { display: none; }
  #countdownNum { font-size: 64px; font-weight: 800; text-align: center; color: var(--accent); }
  #progressWrap { display: none; }
  #nextNote { text-align: center; font-size: 15px; color: var(--muted); margin-bottom: 10px; }
  #nextNote b { color: var(--text); font-size: 22px; margin-left: 6px; }
  .bar { height: 8px; border-radius: 999px; background: var(--card-edge); overflow: hidden; margin-bottom: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .2s; }
  #progressText { font-size: 13px; color: var(--muted); text-align: right; margin-bottom: 10px; }

  #feed { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
  .feedItem {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--bg);
  }
  .feedItem .idx { color: var(--muted); flex: none; }
  .grade-Perfect { color: var(--good); font-weight: 600; }
  .grade-Great { color: var(--accent); font-weight: 600; }
  .grade-Good { color: var(--warn); font-weight: 600; }
  .grade-Miss { color: var(--bad); font-weight: 600; }
  .pitch-bad { color: var(--bad); }

  /* 결과 */
  #resultCard { display: none; text-align: center; }
  #overallScore { font-size: 52px; font-weight: 800; color: var(--good); }
  #overallScore small { font-size: 18px; color: var(--muted); font-weight: 600; }
  .resultRow { display: flex; justify-content: space-around; margin-top: 14px; }
  .resultRow div { font-size: 13px; color: var(--muted); }
  .resultRow b { display: block; font-size: 20px; color: var(--text); margin-bottom: 2px; }
  #gradeRow { margin-top: 14px; display: flex; justify-content: space-around; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎹 Keymento</h1>
    <span id="stateBadge">대기 중</span>
  </header>

  <section class="card">
    <h2>곡 선택</h2>
    <div id="songList"></div>
  </section>

  <section class="card">
    <h2>속도</h2>
    <div class="segment" id="speedRow"></div>
  </section>

  <section class="card">
    <h2>입력</h2>
    <div class="segment" id="inputRow"></div>
  </section>

  <section class="card">
    <h2>모드</h2>
    <div class="segment" id="modeRow"></div>
    <div id="modeDesc"></div>
  </section>

  <div>
    <button id="mainBtn">▶ 연주 시작</button>
    <div id="hint"></div>
  </div>

  <section class="card" id="liveCard">
    <h2>진행 상황</h2>
    <div id="countdownNum"></div>
    <div id="progressWrap">
      <div id="nextNote">다음 목표<b id="nextNoteName">-</b></div>
      <div class="bar"><i id="barFill"></i></div>
      <div id="progressText"></div>
      <div id="feed"></div>
    </div>
  </section>

  <section class="card" id="resultCard">
    <h2>최종 결과</h2>
    <div id="overallScore">0<small> / 100점</small></div>
    <div class="resultRow">
      <div><b id="pitchAcc">-</b><span id="pitchAccLabel">음정 정확도</span></div>
      <div><b id="timingAcc">-</b><span id="timingAccLabel">박자 정확도</span></div>
    </div>
    <div id="gradeRow"></div>
  </section>
</main>

<script>
const INPUT_LABELS = { local: "로컬 MIDI", udp: "라즈베리파이 (UDP)" };
const STATE_LABELS = {
  idle: "대기 중", countdown: "카운트다운", playing: "연주 중",
  done: "완주!", aborted: "중단됨", error: "오류",
};
const GRADE_EMOJI = { Perfect: "✨", Great: "👍", Good: "👌", Miss: "☁️" };

let lastSeq = 0;
let running = false;

const $ = (id) => document.getElementById(id);

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    $("hint").textContent = data.error || "요청 실패";
    setTimeout(() => { $("hint").textContent = ""; }, 3000);
  }
  if (data.songs) render(data);
  return data;
}

function render(s) {
  running = s.running;

  // 상태 배지
  const badge = $("stateBadge");
  badge.textContent = STATE_LABELS[s.state] || s.state;
  badge.className = s.state;

  // 곡 목록
  const list = $("songList");
  list.innerHTML = "";
  if (!s.songs.length) {
    list.innerHTML = '<div style="color:var(--muted);font-size:14px">songs/ 폴더에 .mid 파일이 없습니다.</div>';
  }
  for (const song of s.songs) {
    const btn = document.createElement("button");
    btn.className = "song" + (song.id === s.selected ? " selected" : "");
    btn.disabled = running;
    btn.innerHTML = '<span class="dot"></span><span></span>';
    btn.lastElementChild.textContent = song.name;
    btn.onclick = () => postJSON("/api/select", { song_id: song.id });
    list.appendChild(btn);
  }

  // 속도 프리셋
  const speedRow = $("speedRow");
  speedRow.innerHTML = "";
  for (const p of s.presets) {
    const btn = document.createElement("button");
    btn.textContent = p + "x";
    btn.disabled = running;
    if (Math.abs(p - s.speed) < 1e-9) btn.className = "active";
    btn.onclick = () => postJSON("/api/speed", { speed: p });
    speedRow.appendChild(btn);
  }

  // 입력 소스
  const inputRow = $("inputRow");
  inputRow.innerHTML = "";
  for (const src of s.input_sources) {
    const btn = document.createElement("button");
    btn.textContent = INPUT_LABELS[src] || src;
    btn.disabled = running;
    if (src === s.input) btn.className = "active";
    btn.onclick = () => postJSON("/api/input", { source: src });
    inputRow.appendChild(btn);
  }

  // 모드 (일반 / 연습)
  const modeRow = $("modeRow");
  modeRow.innerHTML = "";
  for (const [practice, label] of [[false, "일반"], [true, "연습"]]) {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.disabled = running;
    if (practice === s.practice) btn.className = "active";
    btn.onclick = () => postJSON("/api/mode", { practice });
    modeRow.appendChild(btn);
  }
  $("modeDesc").textContent = s.practice
    ? "정답 건반을 칠 때까지 다음 음으로 넘어가지 않습니다. 기다리는 시간이 섞이므로 박자는 판정하지 않고, 점수는 음정만으로 냅니다."
    : "악보 시계대로 진행합니다. 시간 안에 못 치면 Miss 로 넘어가고, 음정과 박자를 함께 판정합니다.";

  // 시작/중지 버튼
  const mainBtn = $("mainBtn");
  if (running) {
    mainBtn.textContent = "■ 중지";
    mainBtn.className = "stop";
  } else {
    mainBtn.textContent = "▶ 연주 시작";
    mainBtn.className = "";
  }
  mainBtn.disabled = !running && !s.songs.length;

  // 진행 카드
  const live = $("liveCard");
  if (s.state === "countdown") {
    live.style.display = "block";
    $("countdownNum").textContent = s.countdown;
    $("progressWrap").style.display = "none";
  } else if (s.state === "playing") {
    live.style.display = "block";
    $("countdownNum").textContent = "";
    $("progressWrap").style.display = "block";
    const p = s.progress;
    $("nextNoteName").textContent = p.next || "🎉";
    $("barFill").style.width = p.total ? (100 * p.index / p.total) + "%" : "0";
    $("progressText").textContent = p.index + " / " + p.total;
  } else if (!running) {
    if (s.state === "idle") live.style.display = "none";
    $("countdownNum").textContent = "";
  }

  // 오류 표시
  if (s.state === "error" && s.error) $("hint").textContent = s.error;

  // 결과 카드
  const resultCard = $("resultCard");
  if (s.result) {
    const practice = s.result.mode === "practice";
    resultCard.style.display = "block";
    $("overallScore").innerHTML = s.result.overall + "<small> / 100점</small>";
    $("pitchAcc").textContent = s.result.pitch_accuracy + "%";
    $("pitchAccLabel").textContent = practice ? "한 번에 맞춘 비율" : "음정 정확도";
    $("timingAcc").textContent = practice ? "-" : s.result.timing_accuracy + "%";
    $("timingAccLabel").textContent = practice ? "박자 판정 없음" : "박자 정확도";
    const row = $("gradeRow");
    row.innerHTML = "";
    if (practice) {
      const div = document.createElement("div");
      div.className = "grade-Good";
      div.textContent = "🔁 총 오타 " + s.result.wrong_attempts + "회";
      row.appendChild(div);
    } else {
      for (const g of ["Perfect", "Great", "Good", "Miss"]) {
        const div = document.createElement("div");
        div.className = "grade-" + g;
        div.textContent = GRADE_EMOJI[g] + " " + g + " " + s.result.timing[g];
        row.appendChild(div);
      }
    }
    // 화음은 순서를 따지지 않고 한 박으로 세므로 박자 개수와 음 수가 다르다.
    if (s.result.chords) {
      const div = document.createElement("div");
      div.className = "grade-Good";
      div.textContent = "🎹 화음 " + s.result.chords + "곳";
      row.appendChild(div);
    }
  } else {
    resultCard.style.display = "none";
  }

  // 세션 이벤트 → 판정 피드
  for (const [seq, ev] of s.events) {
    lastSeq = Math.max(lastSeq, seq);
    if (ev.type === "start") $("feed").innerHTML = "";
    if (ev.type !== "note") continue;
    const item = document.createElement("div");
    item.className = "feedItem";
    const pitch = ev.pitch_ok
      ? "✅ " + ev.played
      : '❌ <span class="pitch-bad">' + ev.played + "</span> (정답: " + ev.expected + ")";

    // 연습 모드는 박자를 판정하지 않아 grade 가 null 로 온다.
    let mark;
    if (ev.grade) {
      const diff = (ev.diff_ms >= 0 ? "+" : "") + ev.diff_ms + "ms";
      mark = '<span class="grade-' + ev.grade + '">' +
        GRADE_EMOJI[ev.grade] + " " + ev.grade + " " + diff + "</span>";
    } else if (ev.retry) {
      mark = '<span class="grade-Miss">🔁 다시</span>';
    } else if (ev.first_try) {
      mark = '<span class="grade-Perfect">✅ 한 번에</span>';
    } else {
      mark = '<span class="grade-Good">☑️ 통과</span>';
    }

    item.innerHTML =
      '<span class="idx">' + ev.index + "/" + ev.total + "</span>" +
      "<span>" + pitch + "</span>" + mark;
    $("feed").prepend(item);
    while ($("feed").children.length > 30) $("feed").lastChild.remove();
  }
}

async function poll() {
  try {
    const res = await fetch("/api/state?since=" + lastSeq);
    if (res.ok) render(await res.json());
  } catch (e) { /* 서버 재시작 등 일시 오류는 다음 폴링에서 복구 */ }
}

$("mainBtn").onclick = () => postJSON(running ? "/api/stop" : "/api/start");

poll();
setInterval(poll, 600);
</script>
</body>
</html>
